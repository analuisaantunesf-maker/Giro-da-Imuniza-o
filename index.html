
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão Saúde</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f4f0f7;
      font-family: Arial, sans-serif;
      color: #30243b;
    }

    .cartao {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #30243b18;
    }

    h1 { color: #853f91; }
    p { line-height: 1.6; }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #c9bfd0;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #853f91;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: wait; }
    #jogo { display: none; }
    #mensagem { color: #853f91; font-size: 14px; }
  </style>
</head>
<body>
  <main class="cartao">
    <section id="identificacao">
      <h1>Conexão Saúde</h1>
      <p>Roda de Palavras: Sarampo e Poliomielite</p>
      <p>Digite seu nome ou apelido para começar.</p>

      <form id="formulario">
        <input
          id="nome"
          type="text"
          placeholder="Seu nome ou apelido"
          maxlength="40"
          autocomplete="nickname"
          required
        >
        <button id="botaoIniciar" type="submit">Iniciar jogo</button>
        <p id="mensagem" role="status"></p>
      </form>
    </section>

    <section id="jogo">
      <h1>Vamos começar!</h1>
      <p>Bem-vindo(a), <strong id="jogador"></strong>.</p>
      <p>Seu nome foi registrado. Sua pontuação inicial é zero.</p>
      <p>Em breve, conectaremos esta tela à Roda de Palavras.</p>
      <button id="voltar" type="button">Voltar</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://slejqzzftvrwotifuszc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_1AOWNM1KRkErfqfTCfeWfg_rmQzpO6I";

    const cliente = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formulario = document.getElementById("formulario");
    const campoNome = document.getElementById("nome");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botaoIniciar");
    const identificacao = document.getElementById("identificacao");
    const telaJogo = document.getElementById("jogo");

    formulario.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      const nome = campoNome.value.trim();
      if (!nome) return;

      botao.disabled = true;
      mensagem.textContent = "Registrando participante...";

      try {
        const { error } = await cliente
          .from("ranking")
          .insert([{ nome: nome, pontuacao: 0 }]);

        if (error) throw error;

        document.getElementById("jogador").textContent = nome;
        identificacao.style.display = "none";
        telaJogo.style.display = "block";
      } catch (erro) {
        console.error(erro);
        mensagem.textContent =
          "Não foi possível registrar. Confira a conexão e tente novamente.";
      } finally {
        botao.disabled = false;
      }
    });

    document.getElementById("voltar").addEventListener("click", function() {
      telaJogo.style.display = "none";
      identificacao.style.display = "block";
      mensagem.textContent = "";
    });
  </script>
</body>
</html>
